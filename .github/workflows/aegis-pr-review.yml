name: Aegis PR Review
on:
  pull_request:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review'))
    uses: vpeetla-ai/aegis-pr-review/.github/workflows/reusable-pr-review.yml@main
    secrets: inherit
    with:
      fail_on: ""

